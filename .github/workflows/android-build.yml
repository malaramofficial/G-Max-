name: Android build
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Extract Android project
        run: unzip -q MeshChat.zip -d .
      - name: Build and run Android unit tests
        working-directory: MeshChat
        run: gradle --no-daemon assembleDebug testDebugUnitTest
      - name: Run platform-independent core checks
        working-directory: MeshChat
        run: bash core-verify/run.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: meshchat-debug-apk
          path: MeshChat/app/build/outputs/apk/debug/*.apk
