name: MeshChat Android build

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract and patch source
        run: |
          unzip -q MeshChat.zip -d .
          base64 -d MeshChat-fixes.patch.gz.b64 | gzip -d > /tmp/meshchat-fixes.patch
          patch -p1 -d MeshChat < /tmp/meshchat-fixes.patch
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p MeshChat assembleDebug
      - name: Run pure Kotlin core checks
        run: |
          GRADLE_LIB="$(dirname "$(dirname "$(readlink -f "$(command -v gradle)")")")/lib"             bash MeshChat/core-verify/run.sh
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MeshChat-debug-apk
          path: MeshChat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
