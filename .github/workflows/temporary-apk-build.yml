name: Temporary APK Build

on:
  push:
    paths:
      - ".github/workflows/temporary-apk-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract original project archive
        run: |
          test -f MeshChat.zip
          unzip -q MeshChat.zip -d .
          test -f MeshChat/app/build.gradle.kts
          test -f MeshChat/settings.gradle.kts

      - name: Build debug APK without source edits
        working-directory: MeshChat
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeshChat-debug-apk
          path: MeshChat/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
